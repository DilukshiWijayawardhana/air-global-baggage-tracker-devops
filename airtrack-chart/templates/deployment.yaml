apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: airtrack
  template:
    metadata:
      labels:
        app: airtrack
    spec:
      containers:
        - name: airtrack-container
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always  # <--- ADD THIS LINE
          ports:
            - containerPort: 8080

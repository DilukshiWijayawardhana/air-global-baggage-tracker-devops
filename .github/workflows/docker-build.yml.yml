name: AirTrack Docker Build Pipeline

on:
  repository_dispatch:
    types: [start-docker-build]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Acknowledge Webhook Dispatch
      run: echo "Webhook payload received. Initiating automated Docker build sequence."

    - name: Checkout Application Repository
      uses: actions/checkout@v4
      with:
        repository: DilukshiWijayawardhana/air-global-baggage-tracker-dev

    - name: Checkout Infrastructure Repository
      uses: actions/checkout@v4
      with:
        path: devops-files

    # Authenticate with Docker Hub Container Registry
    - name: Authenticate to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Execute multi-stage Docker build and push to remote registry
    - name: Build and Push Docker Image
      run: |
        echo "Initiating Docker build process..."
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/airtrack-api:latest -f devops-files/Dockerfile .

        echo "Pushing container image to Docker Hub registry..."
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/airtrack-api:latest

        echo "Deployment artifact successfully published."